[package]
name = "xmip-core-identify-endpoint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify-endpoint"
description = "Identify by endpoint: the identity the Receive Location's configuration names for whatever arrives on it; a transport-layer claim, inferred. A xmip-core-identify technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the identifier trait, the arrival and the claim live
# there. The mechanism it reads is declared once in xmip-core (ADR-0050).
identify = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
